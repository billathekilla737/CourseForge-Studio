<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CourseForge Studio</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=home-3">
<!-- Area-only styles. An area that is not installed yet has no file here; the
     404 is harmless and the page renders without it. -->
<link rel="stylesheet" href="css/a11y.css">
<link rel="stylesheet" href="css/docs.css">
<link rel="stylesheet" href="css/pdf.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/courseops.css">
<link rel="stylesheet" href="css/assistant.css">
<link rel="stylesheet" href="css/student.css?v=students-12">
<link rel="stylesheet" href="css/hub.css?v=glance-8">
<link rel="stylesheet" href="css/inbox.css?v=inbox-5">
<link rel="stylesheet" href="css/attendance.css?v=attend-5">
<link rel="stylesheet" href="css/schedule.css?v=schedcal-1">
</head>
<body>

<button class="skip" id="skipLink" type="button">Skip to content</button>

<header>
  <div class="brand">
    <a href="#/" class="brandHome" aria-label="CourseForge Studio home">CourseForge Studio</a>
    <small id="hostLine">checking Canvas…</small>
  </div>
  <div class="crumbs" id="crumbs" aria-label="Where you are"></div>
  <div class="spacer"></div>
  <!-- The inbox count. Its own slot rather than #headerActions, which every
       view clears: mail waiting is true wherever you are standing. -->
  <div id="inboxChip"></div>
  <div id="headerActions" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"></div>
  <!-- Jobs whose dialog has been closed. Every view clears #headerActions, so
       running work needs a home of its own that survives navigation. -->
  <div id="jobDock" class="jobDock"></div>
  <span class="status" id="status" role="status" aria-live="polite"></span>
</header>

<!-- The area bar: Grade, Accessibility, Build, Tools, Assistant. Shown wherever
     a course is open and the grading workspace is not. -->
<nav id="areaBar" class="areaBar hidden" aria-label="Course areas"></nav>

<div id="banners"></div>

<!-- picker: the course list, and the assignment list of one course -->
<section id="viewPicker" class="wrap">
  <!-- The course you were last grading in, offered with one button. Painted by
       grade.js on the course list only, and left empty when there is nothing to
       carry on with, so a first run is not given a band about nothing. -->
  <div id="pickerResume"></div>
  <div class="sectionHead">
    <h2 id="pickerTitle">Your courses</h2>
    <span class="hint" id="pickerHint">Reading your courses from Canvas…</span>
    <div class="spacer"></div>
    <button class="btn sm" id="btnExpand" type="button" hidden
      title="Show the figures for every course in this list">Expand all</button>
    <button class="btn sm" id="btnCollapse" type="button" hidden
      title="Hide the figures for every course in this list">Collapse all</button>
    <button class="btn sm" id="btnRefresh">Refresh from Canvas</button>
  </div>
  <div id="pickerBody"></div>
  <!-- hub.js paints "Across your courses" here on the course list only -->
  <div id="pickerStrip"></div>
  <div id="storageBar"></div>
</section>

<!-- the Canvas Inbox: messages from students across every course -->
<section id="viewInbox" class="wrap hidden"></section>

<!-- term schedule: every dated assignment across the term's courses -->
<section id="viewSchedule" class="hidden">
  <div class="schedHead bandHead">
    <div class="wrap">
      <h1 id="schedTitle">Term schedule</h1>
      <p class="schedSub" id="schedSub"></p>
      <div class="schedStats" id="schedStats"></div>
    </div>
  </div>
  <div class="wrap">
    <div class="schedControls" id="schedControls"></div>
    <div id="schedBody"></div>
    <footer class="schedFoot" id="schedFoot"></footer>
  </div>
</section>

<!-- course hub: where each area stands in one course -->
<section id="viewHub" class="hidden">
  <div class="bandHead">
    <div class="wrap">
      <h1 id="hubTitle">Course</h1>
      <p class="bandSub" id="hubSub"></p>
      <div id="hubStats"></div>
    </div>
  </div>
  <div class="wrap" id="hubBody"></div>
</section>

<!-- shared area shell: one head, optional sub-tabs, one body -->
<section id="viewArea" class="hidden">
  <div class="wrap">
    <div class="areaHead">
      <h1 id="areaTitle"></h1>
      <span class="hint" id="areaHint"></span>
      <div class="spacer"></div>
      <div id="areaActions" class="areaActions"></div>
    </div>
    <div id="areaTabs" role="tablist" aria-label="Sections" hidden></div>
    <div id="areaBody" role="tabpanel"></div>
  </div>
</section>

<!-- workspace -->
<main class="work hidden" id="viewWork">
  <aside>
    <div class="rosterTools">
      <input type="search" id="search" placeholder="Filter students…" autocomplete="off" aria-label="Filter students">
      <div class="chips" id="filters">
        <button class="chip" data-f="all" aria-pressed="true">All</button>
        <button class="chip" data-f="submitted" aria-pressed="false"
          title="Only students who actually turned something in">Turned in</button>
        <button class="chip" data-f="review" aria-pressed="false">Needs review</button>
        <button class="chip" data-f="human" aria-pressed="false">Edited</button>
        <button class="chip" data-f="ungraded" aria-pressed="false">Ungraded</button>
        <button class="chip" data-f="missing" aria-pressed="false">Missing</button>
        <button class="chip" data-f="conflict" aria-pressed="false"
          title="Students where Canvas holds a different score from the one here">Conflicts</button>
      </div>
      <label class="rosterSort">Organize
        <select id="rosterSort" aria-label="Organize the class list">
          <option value="submitted">Turned in, then name</option>
          <option value="name">Name A–Z</option>
          <option value="name-desc">Name Z–A</option>
          <option value="grade-desc">Grade, highest first</option>
          <option value="grade-asc">Grade, lowest first</option>
          <option value="late">Most late first</option>
        </select>
      </label>
    </div>
    <div class="roster" id="roster"></div>
    <div class="bulkBar" id="bulkBar"></div>
  </aside>
  <section class="detail" id="detail"></section>
  <section class="workPane" id="workPane"></section>
</main>

<!-- teaching zone: everything here reads the results back as feedback on the
     teaching, and none of it changes a grade -->
<footer class="teachBar hidden" id="teachBar"></footer>

<div id="modalHost"></div>
<!-- job state changes are read out here for screen readers -->
<div id="live" class="srOnly" aria-live="polite" aria-atomic="true"></div>

<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
} }
</script>
<script src="vendor/highlight/highlight.min.js"></script>
<!-- Load order matters: the shell, the components, then every area, then the
     boot call. An area script that does not exist yet is a 404 the page
     shrugs off; its hub card says "Not installed". -->
<script src="js/core.js?v=load-5"></script>
<script src="js/components.js"></script>
<script src="js/grade.js?v=home-2"></script>
<script src="js/hub.js?v=todo-6"></script>
<script src="js/a11y.js"></script>
<script src="js/files.js"></script>
<script src="js/docs.js"></script>
<script src="js/pdf.js"></script>
<script src="js/content.js?v=state-persist-1"></script>
<script src="js/courseops.js"></script>
<script src="js/assistant.js?v=nick-1"></script>
<script src="js/record.js?v=nick-1"></script>
<script src="js/inbox.js?v=inbox-6"></script>
<script src="js/reports.js"></script>
<script src="js/extend.js?v=confirm-1"></script>
<script src="js/student.js?v=students-11"></script>
<script src="js/attendance.js?v=attend-6"></script>
<script src="js/boot.js"></script>
<script type="module" src="js/docview.js?v=docx-1"></script>
<script type="module" src="js/pdfview.js?v=pdf-1"></script>
<script type="module" src="viewer.js"></script>
</body>
</html>
